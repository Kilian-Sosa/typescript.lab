name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.25.0
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/runner install --ignore-workspace --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --dir apps/runner lint
      - run: pnpm --dir apps/runner format:check
      - run: node --test scripts/check-code-quality.test.mjs

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.25.0
          install: false
      - name: Verify audit policy with controlled advisory fixtures
        run: node --test scripts/audit-dependencies.test.mjs
      - name: Audit app and independent runner lockfiles
        run: node scripts/audit-dependencies.mjs
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.25.0
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir apps/runner install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir apps/runner test
      - run: pnpm --dir apps/runner build
        env:
          VITE_RUNNER_PARENT_ORIGIN: https://lab-app.vercel.app
          VITE_RUNNER_ORIGIN: https://lab-runner.vercel.app
      - run: node --test scripts/check-m3-qa-build.test.mjs
      - run: node --test scripts/check-mvp-preview-build.test.mjs
      - run: node --test scripts/check-mvp-production-build.test.mjs
      - run: node --test scripts/check-production-hosted.test.mjs
      # Synthetic public values validate the build only; this artifact is never deployed.
      - run: node scripts/build-mvp-preview.mjs
        env:
          VERCEL_ENV: preview
          VERCEL_TARGET_ENV: preview
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      - run: node scripts/build-m3-qa.mjs
        env:
          VERCEL_ENV: preview
          VERCEL_TARGET_ENV: preview
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test scripts/check-mvp-preview-local.mjs
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
      - run: node --test scripts/check-mvp-production-local.mjs
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
      - run: pnpm test:e2e
      - run: node scripts/check-recovery.mjs --workers=2
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
      - run: pnpm --dir apps/runner test:browser
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
      - run: pnpm test:e2e:runner-local
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
