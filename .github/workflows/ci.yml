name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir apps/runner install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir apps/runner test
      - run: pnpm --dir apps/runner build
        env:
          VITE_RUNNER_PARENT_ORIGIN: https://lab-app.vercel.app
          VITE_RUNNER_ORIGIN: https://lab-runner.vercel.app
      - run: node scripts/build-m3-qa.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm --dir apps/runner test:browser
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
      - run: pnpm test:e2e:runner-local
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
